[project]
name = "chargescope-germany"
version = "0.1.0"
description = "Reproducible public EV charging district data pilot"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.4,<3",
    "geopandas>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["tests", "national/tests", "tools/test_source_package.py"]
pythonpath = [".", "tests", "tools"]
